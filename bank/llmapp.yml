domain: llmapp
title: LLM application engineering (agents, RAG, prompts)
summary: >-
  Building products on top of model APIs: agent loops and the harnesses around them, tool
  interfaces and MCP, retrieval-augmented generation, context construction, guardrails, and the
  cost, latency and reliability work that turns a demo into a production system. About three
  quarters of postings name something in this area, and 82% of AI-engineer postings name agents.
  It is tested in system design rounds, in a build-an-agent or build-a-retriever coding round,
  and in debugging scenarios.
senior_bar:
  - Picks the least autonomous design that solves the task (single call, workflow, agent) and justifies it with error compounding, cost per task and cost of a wrong action.
  - Treats the model as an untrusted proposer, so permissions, argument validation, budgets, idempotency and approvals are enforced in code outside the model and never only in the prompt.
  - Reasons about context as a budgeted, cache-sensitive compiled state and can say what goes in, in what order, what is compacted and what is fetched on demand.
  - Separates retrieval failures from generation failures in RAG, measures each stage, and knows hybrid retrieval, reranking and permission filtering concretely.
  - Changes prompts, tools and models as versioned changes gated by a regression eval, and debugs incidents from traces rather than from guesses.
  - Quantifies cost and latency per completed task (input and output tokens, cache hit rate, time to first token, steps per task) and knows which lever moves which number.
  - Can scope work with a customer down to one measurable workflow, define acceptance criteria and carry it from demo to production.
rounds:
  - ML / AI system design
  - Coding (agent loop, retrieval, output parsing)
  - Debugging and incident scenarios
  - Project deep dive
  - Forward-deployed or customer scenario round
notes:
  - notes/applied_ml/harness.qmd
  - notes/applied_ml/agentic_search.qmd
  - notes/applied_ml/codex.qmd
checklist:
  - skill: agents
    items:
      - Draw the agent loop and name the four parts (model, tools, state, stop condition) and which decisions belong to code
      - Decide between a single call, a fixed workflow and an agent, using error compounding and cost of error
      - Explain router, prompt chain, parallel fan-out, orchestrator-workers and evaluator-optimizer, with a failure mode for each
      - Say when sub-agents with isolated context help and what they cost in tokens and lost context
      - Debug a non-terminating agent from its trace and add the budgets and loop detection that prevent it
      - Write a minimal tool-calling loop from memory
  - skill: tool-use
    items:
      - Explain the function-calling protocol end to end, including how tool results are paired with calls
      - Design a tool schema that is hard to misuse (enums, required fields, non-overlapping tools, compact results)
      - Classify tools by side effect and make retried writes idempotent
      - Decide which parallel tool calls may run concurrently and how partial failures are reported
      - Describe what MCP standardises (tools, resources, prompts, transports, authorization) and its security concerns
      - Say when computer or browser use is justified over an API tool and how to contain it
  - skill: rag
    items:
      - Walk through ingestion, chunking, embedding, hybrid retrieval, reranking, generation and citation
      - Explain how chunk size trades retrieval precision against context and name three chunking strategies
      - Implement reciprocal rank fusion and say why hybrid beats dense-only on identifiers and rare terms
      - Triage a wrong answer into index, retrieval, context assembly or generation failure
      - Enforce document permissions at retrieval time and explain why post-generation filtering is unsafe
      - Evaluate retrieval (recall@k, nDCG) separately from generation (faithfulness, correctness, abstention)
  - skill: vector-db
    items:
      - Explain HNSW, IVF and product quantization and the knob each exposes for recall versus latency
      - Compute the memory footprint of N vectors of dimension d with and without PQ
      - Compare pre-filtering, post-filtering and filter-aware graph search under selective filters
      - Say when brute force or pgvector is enough and when a dedicated vector store is needed
      - Measure ANN recall against exact search and plan a re-embedding migration
  - skill: prompting
    items:
      - List what goes into the context window and order it for both quality and cache reuse
      - Describe compaction strategies and what must survive a summary verbatim
      - Decide between long-context stuffing, one-shot retrieval and agentic retrieval
      - Explain prompt caching as a prefix match and name the common silent invalidators
      - Run prompts as versioned artefacts with a regression suite and pinned model versions
      - Choose few-shot examples and say when they hurt
  - skill: orchestration
    items:
      - Name the components of a harness (context compiler, tool executor, state, controller, verifiers, permissions, observability)
      - Design sandboxing and a permission policy for an agent that can run shell commands
      - Make a long-running agent resumable with an event log, checkpoints and durable human approval
      - Say what LangGraph, LlamaIndex, DSPy and vendor agent SDKs each provide
      - Argue when to write the loop yourself and what you would then have to rebuild
  - skill: llm-apis
    items:
      - Handle rate limits, retries with backoff and jitter, timeouts and streaming errors
      - Check finish reasons (length, tool call, refusal or content filter) before using a response
      - Design provider or model fallback and say why prompts are not portable across models
      - Explain sources of non-determinism and how tests and evals account for it
      - Plan a model version migration with pinned snapshots and a re-qualification eval
  - skill: memory
    items:
      - Distinguish working context, session state and long-term memory (semantic, episodic, procedural)
      - Design the write path (what, when, dedupe, conflict resolution, expiry) and the read path (always loaded versus retrieved)
      - Explain memory poisoning and stale-memory failure modes and their mitigations
      - Scope memory by user and tenant and support inspection and deletion
  - skill: guardrails
    items:
      - Define direct and indirect prompt injection and explain why prompting alone cannot prevent it
      - State the combination of capabilities that makes exfiltration possible and how to break it
      - Lay out input, tool-boundary, output and system-level controls and the latency each adds
      - Describe hallucination controls (grounding, citations, abstention, verification)
      - Measure a guardrail with both attack success rate and false positive rate on benign traffic
  - skill: structured-output
    items:
      - Distinguish prompt-only JSON, JSON mode and schema-constrained decoding and what each guarantees
      - Design a schema that does not force the model to invent values (nullable fields, enums, reasoning before answer)
      - Implement a bounded retry loop that feeds validation errors back to the model
      - Explain why valid JSON can still be truncated or semantically wrong and how to catch it
  - skill: conversational
    items:
      - Break a voice-to-voice latency budget into endpointing, ASR, LLM time to first token and TTS
      - Explain turn detection and barge-in, including truncating history to what was actually spoken
      - Compare a cascaded ASR-LLM-TTS pipeline with a speech-to-speech model
      - Design escalation to a human with a usable handoff summary
  - skill: llm-cost
    items:
      - Write the cost and latency formulas in terms of input, cached and output tokens
      - Rank cost levers (caching, context trimming, output limits, smaller models, batch, response caching)
      - Design a model router or cascade and state when it loses money or quality
      - Diagnose a cost regression by decomposing it into tokens, cache hit rate, steps and model mix
      - Explain time to first token versus total latency and what streaming does and does not fix
  - skill: fde
    items:
      - Run a scoping conversation that ends in one workflow, a success metric and acceptance criteria
      - List what separates a demo from production for an LLM system
      - Measure delivered value against a baseline and track adoption
      - Handle a customer request that is technically wrong or out of scope
  - skill: workflow-automation
    items:
      - Split a business process into deterministic steps and model steps
