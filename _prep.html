<script>
/* Site-wide: persistent checklists and review status on the skill pages. */
(function () {
  "use strict";
  function get(k) { try { return JSON.parse(localStorage.getItem(k) || "{}"); } catch (e) { return {}; } }
  function set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage blocked: ticks last for this page view */ } }

  var chk = get("prep.chk.v1");
  document.querySelectorAll("input.chk").forEach(function (el) {
    el.checked = !!chk[el.dataset.chk];
    el.addEventListener("change", function () {
      if (el.checked) chk[el.dataset.chk] = 1; else delete chk[el.dataset.chk];
      set("prep.chk.v1", chk);
    });
  });

  var cards = (get("prep.v1").cards) || {};
  document.querySelectorAll("details.qa[id]").forEach(function (el) {
    var r = cards[el.id];
    if (r) el.classList.add(r.ivl >= 7 ? "st-known" : "st-learning");
  });

  // open the question a link points at
  function openTarget() {
    var id = decodeURIComponent(location.hash.slice(1));
    var el = id && document.getElementById(id);
    if (el && el.tagName === "DETAILS") { el.open = true; el.scrollIntoView({ block: "start" }); }
  }
  window.addEventListener("hashchange", openTarget);
  openTarget();

  var mp = document.getElementById("map-progress");
  if (mp) {
    var seen = Object.keys(cards).length, known = Object.keys(cards).filter(function (k) { return cards[k].ivl >= 7; }).length;
    var ticks = Object.keys(chk).length;
    if (seen || ticks) {
      mp.className = "tile";
      mp.style.marginBottom = "1.2rem";
      mp.textContent = "Your progress in this browser: " + seen + " cards reviewed, " + known + " known, " + ticks + " checklist items ticked.";
    }
  }
})();
</script>
